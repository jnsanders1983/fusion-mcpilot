name: Offline skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Portable installer checks
        run: |
          sh -n Install.sh
          sh ./Install.sh --skill-directory "$RUNNER_TEMP/mcpilot-skills"
      - name: Validate portable package
        run: python -B devtools/package_skill.py --package-root . --skill-name fusion-360-mcp --zip-path fusion-mcpilot.zip
